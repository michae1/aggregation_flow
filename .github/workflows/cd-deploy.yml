name: CD Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_PROD_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_PROD_USER }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_PROD_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_PROD_WAREHOUSE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_PROD_DATABASE }}
      SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_PROD_SCHEMA }}
      SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PROD_PRIVATE_KEY_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: 3.11
      - name: Install SnowCLI
        run: pip install --upgrade snowcli
      - name: Decode prod private key
        run: |
          echo "${{ secrets.SNOWFLAKE_PROD_PRIVATE_KEY }}" | base64 --decode > ${{ runner.temp }}/snowflake_prod_key.pem
      - name: Deploy to production
        run: |
          snow sql --account $SNOWFLAKE_ACCOUNT \
            --username $SNOWFLAKE_USER \
            --role $SNOWFLAKE_ROLE \
            --warehouse $SNOWFLAKE_WAREHOUSE \
            --database $SNOWFLAKE_DATABASE \
            --schema $SNOWFLAKE_SCHEMA \
            --authenticator SNOWFLAKE_JWT \
            --private-key-path ${{ runner.temp }}/snowflake_prod_key.pem \
            --private-key-passphrase "$SNOWFLAKE_PRIVATE_KEY_PASSPHRASE" \
            --file deploy.sql
